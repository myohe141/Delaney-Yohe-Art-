                    </div>

            </div>

            <!-- Gallery Item 2 -->
            <div class="portfolio-item paintings" data-title="Ethereal Landscapes" data-desc="Oil on linen panel" data-year="2024" data-dims="24” x 30”">

                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?auto=format&fit=crop&q=80&w=800" alt="Ethereal Landscapes Painting">

            <div class="portfolio-item ceramics" data-title="Earth & Form" data-desc="Hand-coiled stoneware with matte slip glaze" data-year="2025" data-dims="12” x 12” x 14”">

                    <div class="overlay">
                        <h3>Earth & Form</h3>
                        <p>Ceramics, 2025</p>
                    </div>
                </div>
            </div>

            <!-- Gallery Item 4 -->
            <div class="portfolio-item paintings" data-title="Denison Studios study" data-desc="Acrylic on raw canvas" data-year="2020" data-dims="18” x 24”">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&q=80&w=800" alt="Denison Studios Study Painting">
                    <div class="overlay">
                        <h3>Denison Studios Study</h3>
                        <p>Acrylic, 2020</p>
                    </div>
                </div>

        </div>
